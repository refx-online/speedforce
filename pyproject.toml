[project]
name = "speedforce"
version = "0.1.0"
description = "osu!(lazer) API v2 + realtime for the re;fx server"
authors = [{ name = "refx-online" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "orjson>=3.10.7",
    "python-dotenv>=1.0.1",
    # NOTE: required for /oauth/token. lazer sends that request as
    # multipart/form-data (osu-framework WebRequest), and FastAPI's Form()
    # silently sees zero fields without this installed.
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    "redis>=5.0.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    # runtime: app/route/scores.py forwards submissions to forlorn over http
    "httpx>=0.27.0",
    "msgpack>=1.2.3",
]

[dependency-groups]
dev = [
    "black>=24.1.1",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "app" }]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
add_imports = ["from __future__ import annotations"]
force_single_line = true
profile = "black"
line_length = 120

[tool.mypy]
# msgpack ships no py.typed marker, so it reads as untyped rather than absent.
# Its API surface here (packb/unpackb/Unpacker) is stable and small.
[[tool.mypy.overrides]]
module = "msgpack"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
